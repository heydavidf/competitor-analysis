# Keeps the pinned action commits in CI up to date (monthly, one grouped pull request).
# The skill has no package dependencies, so GitHub Actions is the only ecosystem.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 2
